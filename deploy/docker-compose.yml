# Production stack of the API. GitHub Actions copies it to /opt/pulso-api on every
# deploy; it is not edited by hand on the server.
#
# It never builds: the image is compiled once in CI and published to GHCR.
# The real .env lives only on the server (/opt/pulso-api/.env).
#
# No database here: PostgreSQL is a separate stack (`atm-postgres`) reachable through
# the external network `atm-network`. In DATABASE_URL the host is the container name,
# not localhost. The same network gives access to `identity-api` for DNI/RUC lookups.

networks:
  shared:
    name: atm-network
    external: true

services:
  # Applies the pending migrations and exits. `app` does not start until this ends
  # successfully, so a broken migration blocks the deploy.
  migrate:
    image: ghcr.io/atmosferasoltec/atm-pulso-api:${IMAGE_TAG:-latest}
    command: ["migrate"]
    env_file: .env
    networks:
      - shared
    restart: "no"

  app:
    image: ghcr.io/atmosferasoltec/atm-pulso-api:${IMAGE_TAG:-latest}
    container_name: pulso-api
    env_file: .env
    environment:
      APP_ENV: production
      PORT: "3001"
    # Loopback only. The web reaches it through its own nginx (`/api` is proxied to
    # `pulso-api:3001` on the shared network), so it needs no public name.
    ports:
      - "127.0.0.1:3081:3001"
    networks:
      - shared
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    # argon2id uses ~19 MiB per login in flight; leave room for a few at once.
    mem_limit: 256m
