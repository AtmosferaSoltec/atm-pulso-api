openapi: 3.1.0
info:
  title: Pulso API
  version: 0.1.0
  description: |
    Backend of Pulso, Atmósfera's gym administration product.

    - Everything lives under `/api/v1`. JSON, `snake_case`.
    - Success: `{ "data": ... }`. Error: `{ "error": { "code", "message", "details" } }`.
    - `code` is stable and in English; `message` is Spanish and only a readable fallback.
    - Identity belongs to **atm-auth-api**. The web (and the console) sign in there and send the
      access token (RS256) as `Authorization: Bearer <token>`; this API only verifies it with the
      public keys at `<AUTH_API_URL>/.well-known/jwks.json` and keeps no session, password or login.
      There is no login endpoint here.
    - Two kinds of token. A **person's** token (role `user`, system `pulso`, one company and its client)
      opens everything except `/admin/*`; its `app_role` must be `admin` or `receptionist`. The
      **platform administrator's** token (atm-auth-api's superadmin, no system, no company) opens only `/admin/*`.
    - Model: a **group** is an internal label the superadmin uses to bundle related gyms (not a user; there is no
      owner); an auth *company* with Pulso enabled is a **gym** (a brand; the token's company is the current gym);
      a gym has **branches**. Members, payments, receipts and access belong to one gym: nothing is shared between
      gyms, not even of the same group. Groups, gym grouping and branches are managed only by the superadmin
      from the console.
    - Errors of the guard: `UNAUTHORIZED` (401, missing/invalid/expired token), `NO_ACCESS` (403, the token
      does not open Pulso: other system, unknown role, no company), `USER_INACTIVE` (403, blocked in Pulso),
      `FORBIDDEN` (403, wrong kind of token or role), `FEATURE_DISABLED` (403, the route belongs to an optional
      module — `sales`, `body_tracking`, `kiosk` — that the gym has not switched on; see `Gym.features`).
servers:
  - url: http://localhost:3001/api/v1
    description: local development
tags:
  - name: health
  - name: profile
  - name: admin
  - name: documents
  - name: body_tracking
    description: Optional module `body_tracking` (measurements, routines, access log). Sensitive health data.
  - name: products
    description: Optional module `sales` (catalog, sales of products, pending collections). Separate from membership income.

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness. The process answers.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness. The database answers too.
      responses:
        "200": { description: ok }
        "503": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [profile]
      summary: The signed-in user and where they work.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [profile]
      summary: Edit your own non-sensitive data (name and phone).
      description: The DNI, role and scope cannot be edited here.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, minLength: 3, maxLength: 120 }
                phone:
                  type: string
                  pattern: "^9[0-9]{8}$"
                  description: Optional. An empty string clears it.
      responses:
        "200":
          description: the updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/groups:
    get:
      tags: [admin]
      summary: Every group with its gyms and branches (superadmin).
      description: |
        First records every company that has Pulso enabled in atm-auth-api (itself as a gym with a default
        branch "Sede principal", inside the group that already holds a gym of the same auth client, or a new
        group named after that client); if atm-auth-api does not answer, the stored groups are listed.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a group (superadmin).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: The group (no gyms yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGroup" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/groups/{id}:
    patch:
      tags: [admin]
      summary: Rename a group (superadmin).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGroup" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove an empty group (superadmin). A group that still has gyms answers 409 GROUP_IN_USE.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/gyms/{gym_id}:
    patch:
      tags: [admin]
      summary: Set the look of a gym and/or move it to another group (superadmin).
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one field.
              properties:
                brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
                group_id: { type: string, format: uuid, description: Moves the gym to that group; an unknown group answers 400 SCOPE_NOT_ALLOWED. }
      responses:
        "200":
          description: The gym.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGym" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/gyms/{gym_id}/features:
    patch:
      tags: [admin]
      summary: Switch the optional modules of a gym on or off (superadmin).
      description: |
        Sends the COMPLETE list of modules the gym should have; what is not listed is switched off. The list is closed:
        `sales` (sales of products, paid now or pending collection, and the product catalog), `body_tracking` (measurements and routines), `kiosk` (access
        tablet). An unknown name answers 400 `FEATURES_INVALID`. The gym sees the result in `GET /me` and `GET /catalog`
        (`features`) at its next request. A route of a module the gym does not have answers 403 `FEATURE_DISABLED`.
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [features]
              properties:
                features: { $ref: "#/components/schemas/Features" }
      responses:
        "200":
          description: The gym.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminGym" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/gyms/{gym_id}/branches:
    post:
      tags: [admin]
      summary: Add a branch to a gym (superadmin). Atmósfera charges per branch, so gym admins never do this.
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                address: { type: [string, "null"], maxLength: 200 }
      responses:
        "201":
          description: The branch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminBranch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/branches/{id}:
    patch:
      tags: [admin]
      summary: Rename a branch or change its address (superadmin).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send only the fields to change; null address clears it.
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                address: { type: [string, "null"], maxLength: 200 }
      responses:
        "200":
          description: The branch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminBranch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a branch nobody has used (superadmin).
      description: 409 `BRANCH_IN_USE` when it has members, sales, access history or receptionists, or is the last branch of its gym.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /catalog:
    get:
      tags: [accounts]
      summary: Read the current gym with its branches and which ones the person may operate.
      description: Only the gym of the token; other gyms (even of the same group) are never listed.
      security: [{ bearer: [] }]
      parameters:
      responses:
        "200":
          description: The current gym.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The gym does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      tags: [accounts]
      summary: List the users the caller manages.
      description: |
        The team of the current gym: the people atm-auth-api lets into it (merged with the branches Pulso
        assigned; people the console added are recorded the first time they are listed). Admin only.
        If atm-auth-api cannot be reached the list falls back to the people Pulso already knows.
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TeamUser" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [accounts]
      summary: Create an admin or receptionist in the current gym.
      description: |
        The account and the access are created in atm-auth-api (the DNI is the first password there and
        must be changed at the first login). Admin only. An admin takes no branches; a receptionist needs
        one or more branches of the current gym. Errors: `AUTH_UNAVAILABLE` (503), `USER_IN_OTHER_COMPANY` (409,
        the person already works for another company: only Atmósfera can add them to a second one),
        `ROLE_NOT_ASSIGNABLE`, `SCOPE_NOT_ALLOWED` (a branch of another gym).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewUser" }
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: USER_DOCUMENT_TAKEN, USER_IN_OTHER_COMPANY or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}:
    patch:
      tags: [accounts]
      summary: Change a team member's name, role or branches.
      description: A new role is also applied in atm-auth-api. The DNI cannot be edited. Nobody edits themselves.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserChanges" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: USER_DOCUMENT_TAKEN, USER_IN_OTHER_COMPANY or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/activate:
    post:
      tags: [accounts]
      summary: Reactivate a user.
      description: Immediate effect.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/deactivate:
    post:
      tags: [accounts]
      summary: Deactivate a user.
      description: Takes effect on the next request; history is kept.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/password:
    post:
      tags: [accounts]
      summary: Reset a team member's password to their DNI (in atm-auth-api).
      description: They must choose a new password at their next login. Admin only; `AUTH_UNAVAILABLE` (503) if atm-auth-api does not answer.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /gyms/{gym_id}:
    patch:
      tags: [accounts]
      summary: Change the rules of the current gym (admin).
      description: |
        Send only the fields to change; null for day_pass_price restores the default. A gym admin changes
        `day_pass_price` and `branch_sharing` of the gym of their token (membership prices are per plan: `/membership-plans`). The identity
        (`display_name`, `brand_color`, logo, name) is configured by Atmósfera from the console
        (`PATCH /admin/gyms/{gym_id}`): sending `display_name` or `brand_color` here answers 403 `FORBIDDEN`.
        A gym that is not the one of the token answers 403 `SCOPE_NOT_ALLOWED`.
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GymChanges" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Gym" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, NO_ACCESS, USER_INACTIVE, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED or CANNOT_MODIFY_SELF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another gym).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /membership-plans:
    get:
      tags: [members]
      summary: The membership plans of the gym with their prices.
      description: |
        An admin sees every plan (active or not); reception sees only the active ones (the ones that can be sold).
        Ordered by `position`. A plan never restricts access by itself: entry is allowed when any current period
        of the member, of any plan, opens the branch.
      security: [{ bearer: [] }]
      responses:
        "200": { description: The plans., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/MembershipPlan" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [members]
      summary: Create a membership plan (admin).
      description: |
        Errors: PLAN_NAME_TAKEN (409, names are unique per gym, case-insensitive, also among inactive plans), CONFLICT (409,
        the `id` belongs to something else), VALIDATION_FAILED (400: PLAN_NAME_INVALID, PLAN_DESCRIPTION_INVALID,
        PLAN_PRICES_INVALID, PLAN_POSITION_INVALID), FORBIDDEN (403, reception).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMembershipPlan" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MembershipPlan" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /membership-plans/{id}:
    patch:
      tags: [members]
      summary: Edit, reorder or deactivate a membership plan (admin).
      description: |
        Send only the fields to change; `prices`, when sent, replaces the whole price list. A plan is never deleted
        (its name stays on old receipts): deactivate it with `is_active: false` and it can no longer be sold. Periods
        already sold keep their plan.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPlanChanges" }
      responses:
        "200": { description: The updated plan., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MembershipPlan" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members:
    get:
      tags: [members]
      summary: List the shared member directory with status counts.
      description: Every role of the gym sees every member of the gym (all its branches). Counts ignore the status filter but respect q and home_branch_id.
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name or document (contains). }
        - { name: status, in: query, schema: { type: string, enum: [active, expiring, expired, scheduled] } }
        - { name: home_branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MemberView" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Pagination" }
                      - type: object
                        properties:
                          counts: { $ref: "#/components/schemas/MemberCounts" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [members]
      summary: Enroll a member (member, first period, payment and receipt in one transaction).
      description: |
        The branch must be one the caller works in. Repeating the same `id` returns the original sale with 200.
        Errors: MEMBER_DOCUMENT_TAKEN (409, details.member_id), BRANCH_NOT_ACCESSIBLE (403), SCOPE_NOT_ALLOWED (400, foreign branch),
        ACCESS_BRANCHES_INVALID (400), VALIDATION_FAILED (400).
        `plan_id` is optional when the gym has exactly one active plan (a gym that never configured any gets the default
        plan "Membresía"); with several active plans it is required (400 `PLAN_REQUIRED`), and a plan that is not an active
        plan of the gym answers 400 `PLAN_INVALID`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollMember" }
      responses:
        "200": { description: Repeated request; the original sale., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}:
    get:
      tags: [members]
      summary: A member with every period.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The member., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberDetail" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      tags: [members]
      summary: Edit name and phone (the document never changes).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 3, maxLength: 120 }
                phone: { type: string, pattern: "^9[0-9]{8}$" }
      responses:
        "200": { description: The updated member., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberDetail" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/renewals:
    post:
      tags: [members]
      summary: Renew a member (new period, payment and receipt).
      description: |
        Buying a plan the member already holds (current or scheduled) is a RENEWAL: `starts_on` defaults to the end date of the member's
        latest period OF THE SAME PLAN when it is in the future, otherwise today (the server decides). `plan_id` follows the same rules as
        when enrolling. A period of the same plan can never overlap another one of that plan (periods are half-open `[starts_on, ends_on)`:
        starting on the previous end date is fine, one day earlier is not): an explicit `starts_on` that collides is refused with
        `409 MEMBERSHIP_OVERLAP` and `details { membership_id, starts_on, ends_on, suggested_starts_on }`. Different plans may overlap freely.
        `branch_id` is where it is collected and may differ from the home branch, which never changes.
        Repeating the same `id` (the period id) returns the original sale with 200.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewMember" }
      responses:
        "200": { description: Repeated request; the original sale., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}/memberships/{membership_id}:
    patch:
      tags: [members]
      summary: Correct a membership period that has not ended (months, start, amount, payment method).
      description: |
        Send only the fields to change (at least one). The end date is never sent: the server recalculates it from `starts_on` + `months`.
        Allowed only while the period has not ended (`ends_on >= today`, Lima) and its new end is not in the past; it cannot overlap another
        period of the SAME plan (409 `MEMBERSHIP_OVERLAP`, same details as renewals); the plan itself cannot be changed. The payment and the
        receipt are corrected IN PLACE (same receipt number; the printable receipt shows the new values) and one row is added to the period's
        history (`GET .../amendments`) with the author and the values before and after. Admin and reception; reception needs access to the branch that
        collected the payment (403 `BRANCH_NOT_ACCESSIBLE`). Sending the current values changes and records nothing.
        Errors: MEMBERSHIP_NOT_FOUND (404, also for another gym), MEMBERSHIP_ENDED (409), MEMBERSHIP_OVERLAP (409), VALIDATION_FAILED (400:
        MONTHS_INVALID, START_DATE_INVALID, AMOUNT_INVALID, METHOD_INVALID, PERIOD_ENDS_IN_PAST, NO_CHANGES on `body`).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendMembership" }
      responses:
        "200": { description: The corrected sale (member with recalculated status, period and the same receipt)., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}/memberships/{membership_id}/amendments:
    get:
      tags: [members]
      summary: History of corrections of a period (admin).
      description: Oldest first. Who changed it, when, and the values before and after (`months`, `starts_on`, `ends_on`, `amount`, `method`).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The corrections., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/MembershipAmendment" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/receipts:
    get:
      tags: [members]
      summary: Receipts of a member, newest first.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The receipts., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ReceiptSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
  /products:
    get:
      tags: [sales]
      summary: The product catalog of the gym (module `sales`).
      description: |
        Ordered by `position` then name. Reception always gets the active products (what can be sold); an admin may add `include_inactive=true`.
        Every route of this module answers `403 FEATURE_DISABLED` when the gym has not switched `sales` on.
      security: [{ bearer: [] }]
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean }, description: Admin only (ignored for reception). }
      responses:
        "200": { description: The products., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [sales]
      summary: Add a product (admin).
      description: |
        `price` is text, 0.01 to 10000.00. Names are unique per gym ignoring case. Repeating the same `id` of the gym answers the stored product with 200.
        Errors: PRODUCT_NAME_TAKEN (409), CONFLICT (409, the id belongs to another gym), VALIDATION_FAILED (400: PRODUCT_NAME_INVALID, PRODUCT_PRICE_INVALID, PRODUCT_POSITION_INVALID), FORBIDDEN (403, reception).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProduct" }
      responses:
        "200": { description: Repeated request., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Product" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Product" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /products/{id}:
    patch:
      tags: [sales]
      summary: Edit, reorder or deactivate a product (admin).
      description: Only the fields sent change. A product is never deleted (old sales keep their own photo of name and price); deactivate it with `is_active` false.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductChanges" }
      responses:
        "200": { description: The product., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Product" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /sales:
    get:
      tags: [sales]
      summary: List product sales, newest first.
      description: |
        Admin: the whole gym. Reception: only the branches it works in (`branch_id` of another branch is 403 `BRANCH_NOT_ACCESSIBLE`).
        `from`/`to` filter the Lima sale date (inclusive).
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: member_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [paid, pending] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of sales.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ProductSale" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [sales]
      summary: Register a sale of one or several products, paid now or charged to a member (pending sale).
      description: |
        Quick: no receipt, no series, no inventory. The unit price of each item is taken from the catalog at that moment and kept on the sale
        (a photo). Repeated products are merged. Limits: 1 to 30 different products, 1 to 99 units each, 100000.00 per sale.
        `status` is `paid` (default; `method` required) or `pending` (the pending sale; `member_id` required, `method` ignored: the collection carries it).
        `member_id` is optional on a paid sale. The branch must be one the caller works in. Repeating the same `id` answers the stored sale with 200.
        Errors: BRANCH_NOT_ACCESSIBLE (403), SCOPE_NOT_ALLOWED (400, branch of another gym), CONFLICT (409, id of another gym),
        VALIDATION_FAILED (400: METHOD_INVALID, STATUS_INVALID, MEMBER_REQUIRED, MEMBER_INVALID, ITEMS_INVALID, PRODUCT_INVALID, TOTAL_TOO_LARGE).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProductSale" }
      responses:
        "200": { description: Repeated request; the stored sale., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProductSale" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProductSale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /sales/pending:
    get:
      tags: [sales]
      summary: Members who owe something (open pending sales), the biggest balance first.
      description: "Balances are the gym's (the member directory is shared between branches): both roles see the same list."
      security: [{ bearer: [] }]
      responses:
        "200": { description: The balances., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/PendingBalance" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /sales/collections:
    post:
      tags: [sales]
      summary: Collect whole pending sales of a member.
      description: |
        Pays the listed pending sales (`sale_ids`) or, when absent or empty, ALL the open pending sales of the member, in one transaction, with the payment method and who
        collected it. Partial payments of one sale do not exist: a sale is paid whole or not at all. The paid sales become `paid` (`was_pending: true`, with
        `collection_id`). Repeating the same `id` answers the stored collection with 200. The branch is where it is collected and must be reachable by the caller.
        Errors: SALE_NOT_FOUND (404, not a pending sale of that member in this gym), SALE_NOT_PENDING (409, someone already collected it; nothing is changed),
        NOTHING_TO_COLLECT (409, the member owes nothing), MEMBER_NOT_FOUND (404), BRANCH_NOT_ACCESSIBLE (403), CONFLICT (409), VALIDATION_FAILED (400: METHOD_INVALID, SALE_IDS_INVALID).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCollection" }
      responses:
        "200": { description: Repeated request; the stored collection., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Collection" } } } } } }
        "201": { description: Collected., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Collection" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /sales/report:
    get:
      tags: [sales]
      summary: Product sales report (admin).
      description: |
        Units and money by product and by day or month over a Lima date range (default: from the 1st of the current month to today; at most 800 days),
        optionally for one branch. SEPARATE from the membership income: nothing here is counted in `/payments`, `/payments/export` or `/dashboard`.
        `total_sold` = every sale of the period; `collected_total` = those already paid (including pending sales collected since); `pending_total` = pending sales still open.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_by, in: query, schema: { type: string, enum: [day, month], default: day } }
      responses:
        "200": { description: The report., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProductsReport" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /members/{id}/sales:
    get:
      tags: [sales]
      summary: Purchase history of a member (product sales), newest first.
      description: Every product sale charged to the member, paid or pending, from every branch of the gym (the member directory is shared). Paginated. 404 `MEMBER_NOT_FOUND` for a member of another gym.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of sales.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ProductSale" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/pending-sales:
    get:
      tags: [sales]
      summary: What a member owes (open pending sales) and the sales behind it.
      description: Oldest first. `balance` is the sum of the open pending sales; "0.00" when none. 404 `MEMBER_NOT_FOUND` for a member of another gym.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The balance., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberPending" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /receipts/{id}/vouchers:
    get:
      tags: [vouchers]
      summary: List the proofs of payment attached to a receipt's payment.
      description: Oldest first. Same reach as the branch where the payment was collected.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The receipt id. }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Voucher" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [vouchers]
      summary: Attach a proof of payment (photo or PDF) to a receipt's payment.
      description: |
        Optional and never for cash. The body is the file itself (not JSON): PNG, JPEG, WebP or PDF, at most 10 MB, checked by its content.
        Up to 5 per payment (a payment split in several transfers). Vouchers cannot be edited or deleted: they are evidence.
        Needs access to that branch.
        Answers 503 STORAGE_UNAVAILABLE when no object store is configured.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The receipt id. }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Voucher" }
        "400":
          description: VALIDATION_FAILED with VOUCHER_NOT_FOR_CASH (field `receipt`), VOUCHER_TYPE_INVALID or VOUCHER_SIZE_INVALID (field `voucher`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409":
          description: VOUCHER_LIMIT_REACHED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: STORAGE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /vouchers/{id}/file:
    get:
      tags: [vouchers]
      summary: Download a voucher's file.
      description: |
        Private: only with a valid token and within the reach of the payment's branch. The web fetches it with the token and shows
        it from the received bytes (an `<img src>` cannot send the token). The answer is cacheable only by the browser (`private`).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The voucher id. }
      responses:
        "200":
          description: The file.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
        "503":
          description: STORAGE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /receipts/{id}:
    get:
      tags: [members]
      summary: Printable data of a receipt (membership or day pass).
      description: Any past receipt can be reprinted. A receipt of another gym answers 404.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The receipt., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReceiptDetail" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }

  /access/checks:
    post:
      tags: [access]
      summary: Check a member in at a branch (decided on the server, always logged).
      description: |
        Send `member_id` or `document_number`. A denied check is still `200` with `allowed: false` and a `reason`:
        MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED (ends_on = last end), MEMBERSHIP_NOT_STARTED (ends_on = start date),
        BRANCH_NOT_ALLOWED, NOT_REGISTERED. An allowed answer ending within 7 days has `expiring_in_days`.
        Unknown `member_id` is 404 MEMBER_NOT_FOUND. Repeating the same `id` returns the original answer without a second entry.
        Like every route it is limited per IP (`RATE_LIMIT_PER_MINUTE`, 120 by default): beyond that, 429 `TOO_MANY_REQUESTS`
        with `Retry-After`. The kiosk (`atm-pulso-web` `/kiosk`) uses this endpoint and shows a plain notice on a 429.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                member_id: { type: string, format: uuid }
                document_number: { type: string }
      responses:
        "200": { description: The decision., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AccessCheck" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /access/events:
    get:
      tags: [access]
      summary: History of access entries (checks and day passes), newest first.
      description: Admin sees the current gym, reception its assigned branches. A `branch_id` the caller cannot reach is 403 BRANCH_NOT_ACCESSIBLE.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string, enum: [allowed, denied] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Lima date, inclusive. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Lima date, inclusive. }
        - { name: q, in: query, schema: { type: string }, description: Name or document (contains). }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AccessEvent" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /access/summary:
    get:
      tags: [access]
      summary: Allowed and denied checks and day passes of one Lima day.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today (Lima). }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [allowed, denied, day_passes]
                    properties:
                      allowed: { type: integer }
                      denied: { type: integer }
                      day_passes: { type: integer }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /day-passes:
    get:
      tags: [access]
      summary: List day passes of the branches the caller reaches.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of day passes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DayPass" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [access]
      summary: Sell a day pass (pass, receipt D-NNNNNN, payment and an allowed entry in one transaction).
      description: |
        The price is the gym's (15.00 when it has none); the client cannot choose it. An `amount` is accepted only when it equals the price
        (otherwise VALIDATION_FAILED, AMOUNT_NOT_ALLOWED). Every `visitor` field is optional. Repeating the same `id` returns the original with 200.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, method]
              properties:
                id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                method: { type: string, enum: [yape_plin, cash, card, transfer] }
                amount: { type: string, description: Optional; must equal the gym price. }
                visitor:
                  type: object
                  properties:
                    document_type: { type: string, enum: [dni, ce] }
                    document_number: { type: string }
                    full_name: { type: string }
                    phone: { type: string, pattern: "^9[0-9]{8}$" }
      responses:
        "200": { description: Repeated request; the original., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /day-passes/{id}:
    get:
      tags: [access]
      summary: One day pass. Print it with GET /receipts/{receipt.id}.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The day pass., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }

  /payments:
    get:
      tags: [reports]
      summary: Payments of the branches the caller reaches, with the totals of the whole filter.
      description: |
        Admin reaches the current gym, reception its assigned branches. Dates are Lima dates, inclusive; the default range is the current month and the widest is 366 days.
        `meta.totals` covers the whole filter (not just the page) and is **omitted for reception**, who must not get KPIs.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string, enum: [yape_plin, cash, card, transfer] } }
        - { name: kind, in: query, schema: { type: string, enum: [membership, day_pass] } }
        - { name: q, in: query, schema: { type: string }, description: Member name or document, or visitor name (contains). }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of payments, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaymentRow" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Pagination" }
                      - type: object
                        properties:
                          totals: { $ref: "#/components/schemas/PaymentTotals" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /payments/export:
    get:
      tags: [reports]
      summary: Download the filtered payments as CSV.
      description: |
        Admin only (reception gets 403). Same filters as `/payments`, no pagination. UTF-8 with BOM, comma separated; columns
        Boleta, Miembro, Documento, Plan, Importe, Medio de pago, Fecha. More than 10,000 rows is 413 EXPORT_TOO_LARGE. Cells that start with `= + - @` are prefixed with `'`.
        Fetch it with the Bearer header and save the blob; never put the token in a URL.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string, enum: [yape_plin, cash, card, transfer] } }
        - { name: kind, in: query, schema: { type: string, enum: [membership, day_pass] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "413": { $ref: "#/components/responses/ApiError" }
  /dashboard:
    get:
      tags: [reports]
      summary: Figures of a gym or branch for today and this month.
      description: Admin only (reception gets 403). A new gym answers zeros, never sample data. `expiring_soon` has at most five members, nearest end date first.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The dashboard., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Dashboard" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }

  /kiosk/settings:
    get:
      tags: [kiosk]
      summary: Whether the gym has the kiosk exit PIN (admin and reception). Never returns the PIN.
      description: Needs the `kiosk` module (403 `FEATURE_DISABLED` otherwise). The kiosk screen refuses to start without a PIN.
      security: [{ bearer: [] }]
      responses:
        "200": { description: The settings., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/KioskSettings" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /kiosk/pin:
    put:
      tags: [kiosk]
      summary: Set or replace the kiosk exit PIN (admin only).
      description: 4 to 8 digits (400 `VALIDATION_FAILED`, field code `PIN_INVALID`). Only a bcrypt hash is stored. Needs the `kiosk` module.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: "^[0-9]{4,8}$" }
      responses:
        "200": { description: The settings., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/KioskSettings" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /kiosk/exit:
    post:
      tags: [kiosk]
      summary: Check the exit PIN that takes the access tablet out of kiosk mode (admin and reception).
      description: |
        `200 { data: { ok: true } }` when it matches. 403 `KIOSK_PIN_INVALID` when it does not, 409 `KIOSK_PIN_NOT_SET`
        when the gym has none. Five wrong PINs in a row lock that user for 5 minutes: 429 `KIOSK_PIN_LOCKED`, even for the
        right PIN. Needs the `kiosk` module.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        "200": { description: The PIN matches., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { ok: { type: boolean } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }

  /members/{id}/measurements:
    get:
      tags: [body_tracking]
      summary: Body measurements of a member, newest first (admin and reception).
      description: |
        SENSITIVE health data (law 29733). Needs the `body_tracking` module (403 `FEATURE_DISABLED` otherwise). The member must belong to the
        gym of the token (another gym, even of the same group: 404 `MEMBER_NOT_FOUND`) and a receptionist needs access to the member's home
        branch (403 `BRANCH_NOT_ACCESSIBLE`). Every read is recorded in the access log (who, member, time; never the values). Answers `[]`
        when the member has none (up to the newest 1000).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The measurements., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/BodyMeasurement" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [body_tracking]
      summary: Record a measurement (admin and reception).
      description: |
        Only the date (default today in Lima) and at least one value are required. Decimals are JSON numbers or strings with at most one
        decimal digit. Ranges: weight 20-400 kg, height 50-250 cm, body fat 2-70 %, waist/chest/hip 20-300 cm. The date is a Lima date,
        not in the future and not before 2000-01-01. Notes: up to 500 characters.
        Repeating the same `id` for the same member answers the stored record with 200 (idempotent); an id that belongs to another member or gym
        or to a deleted record is 409 `CONFLICT`. Errors: 400 `VALIDATION_FAILED` (field codes `DATE_INVALID`, `DATE_FUTURE`, `WEIGHT_INVALID`,
        `HEIGHT_INVALID`, `BODY_FAT_INVALID`, `WAIST_INVALID`, `CHEST_INVALID`, `HIP_INVALID`, `VALUE_REQUIRED`, `NOTES_INVALID`),
        403 `FEATURE_DISABLED` / `BRANCH_NOT_ACCESSIBLE`, 404 `MEMBER_NOT_FOUND`. The write is recorded in the access log.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyMeasurementInput" }
      responses:
        "200": { description: The id was already stored., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyMeasurement" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyMeasurement" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}/measurements/{record_id}:
    put:
      tags: [body_tracking]
      summary: Edit a measurement (replaces the whole record; values left out are cleared).
      description: Same body and rules as the creation (without `id`). Errors add 404 `MEASUREMENT_NOT_FOUND`. Updates who and when; recorded in the access log.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyMeasurementInput" }
      responses:
        "200": { description: The updated record., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyMeasurement" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [body_tracking]
      summary: Delete a measurement logically (who and when are kept).
      description: 204. A record already deleted is 404 `MEASUREMENT_NOT_FOUND`. Recorded in the access log.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/routines:
    get:
      tags: [body_tracking]
      summary: "Routines of a member, current ones first, then newest start first (admin and reception)."
      description: Same access rules as the measurements (module, gym, branch). Every read is recorded in the access log. Up to 500.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The routines., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/BodyRoutine" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [body_tracking]
      summary: Record a routine (admin and reception).
      description: |
        `title` 1-80 characters; `content` free text up to 5000; `notes` up to 500; `started_on` defaults to today in Lima and cannot be in the
        future; `is_current` defaults to true (several routines may be current). Idempotent by `id` like the measurements. Field codes:
        `TITLE_INVALID`, `CONTENT_INVALID`, `NOTES_INVALID`, `DATE_INVALID`, `DATE_FUTURE`.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyRoutineInput" }
      responses:
        "200": { description: The id was already stored., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyRoutine" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyRoutine" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}/routines/{record_id}:
    put:
      tags: [body_tracking]
      summary: Edit a routine (replaces the whole record).
      description: Same body and rules as the creation (without `id`). 404 `ROUTINE_NOT_FOUND`. Recorded in the access log.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyRoutineInput" }
      responses:
        "200": { description: The updated record., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BodyRoutine" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [body_tracking]
      summary: Delete a routine logically.
      description: 204. 404 `ROUTINE_NOT_FOUND` when already deleted. Recorded in the access log.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/body-access-log:
    get:
      tags: [body_tracking]
      summary: Who read or wrote the health data of a member (admin only), newest 200 first.
      description: Ids, action, resource and time only; never the values. Reading this log is not itself logged. Reception gets 403 `FORBIDDEN`.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The entries., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/BodyAccessEntry" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }

  /documents/persons/{document_number}:
    get:
      tags: [documents]
      summary: Names of a DNI, resolved by atm-identity-api.
      description: Any signed-in user. Carné de extranjería is not resolved; enter it manually.
      security: [{ bearer: [] }]
      parameters:
        - { name: document_number, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
      responses:
        "200":
          description: the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "502": { $ref: "#/components/responses/LookupUnavailable" }

  /documents/companies/{document_number}:
    get:
      tags: [documents]
      summary: Legal name and address of a RUC, resolved by atm-identity-api.
      security: [{ bearer: [] }]
      parameters:
        - { name: document_number, in: path, required: true, schema: { type: string, pattern: "^[0-9]{11}$" } }
      responses:
        "200":
          description: the company
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "502": { $ref: "#/components/responses/LookupUnavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    CatalogBranch:
      type: object
      required: [id, name, address, accessible]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"] }
        accessible: { type: boolean }
    Catalog:
      type: object
      required: [gyms]
      properties:
        gyms:
          type: array
          description: Exactly one entry, the current gym.
          items: { $ref: "#/components/schemas/Gym" }
    Gym:
      type: object
      required: [id, name, display_name, tax_id, brand_color, logo_url, day_pass_price, day_pass_price_is_default, branch_sharing, features, branches]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: [string, "null"] }
        tax_id: { type: [string, "null"], description: RUC; null when the company has none. }
        brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        logo_url: { type: [string, "null"], description: "Temporary signed https link (atm-storage-api) to the logo of the gym's company profile; null when the gym has no logo or the link cannot be obtained right now. It expires (about an hour): never store it, ask again; fall back to the monogram when it fails to load." }
        day_pass_price: { type: string, example: "15.00" }
        day_pass_price_is_default: { type: boolean }
        branch_sharing: { type: boolean }
        features: { $ref: "#/components/schemas/Features" }
        branches:
          type: array
          items:
            type: object
            required: [id, name, address, accessible]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              address: { type: [string, "null"] }
              accessible: { type: boolean }
    TeamUser:
      type: object
      required: [id, full_name, document_number, phone, role, is_active, is_self, branches]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        document_number: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [admin, receptionist] }
        is_active: { type: boolean, description: False when blocked in Pulso or disabled in atm-auth-api. }
        is_self: { type: boolean }
        branches:
          type: array
          items:
            type: object
            required: [id, name, gym_id]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              gym_id: { type: string, format: uuid }
    NewUser:
      type: object
      required: [full_name, document_number, role]
      properties:
        full_name: { type: string, minLength: 3, maxLength: 120 }
        document_number: { type: string, pattern: "^[0-9]{8}$" }
        role: { type: string, enum: [admin, receptionist] }
        branch_ids:
          type: array
          description: Required for receptionist (one or more branches of the current gym); refused for admin (`SCOPE_INVALID`).
          items: { type: string, format: uuid }
    UserChanges:
      type: object
      description: Send only the fields to change.
      properties:
        full_name: { type: string, minLength: 3, maxLength: 120 }
        role: { type: string, enum: [admin, receptionist] }
        branch_ids:
          type: array
          description: Replaces the branches of a receptionist (required when the role becomes receptionist).
          items: { type: string, format: uuid }
    GymChanges:
      type: object
      description: Send only the fields to change.
      properties:
        day_pass_price: { type: [string, "null"], example: "15.00" }
        branch_sharing: { type: boolean }
    Voucher:
      type: object
      required: [id, content_type, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        content_type: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf] }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
    Features:
      type: array
      description: The optional modules a gym has switched on (closed list), in a fixed order. Only the platform superadmin changes them.
      items: { type: string, enum: [sales, body_tracking, kiosk] }
      example: [kiosk]
    MembershipPrice:
      type: object
      required: [months, amount]
      properties:
        months: { type: integer, minimum: 1, maximum: 24 }
        amount: { type: string, example: "100.00" }
    MembershipPlan:
      type: object
      required: [id, name, description, is_active, position, prices]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60, example: Baile }
        description: { type: [string, "null"], maxLength: 200 }
        is_active: { type: boolean }
        position: { type: integer, minimum: 0, description: Order the plans are offered in (ascending). }
        prices:
          type: array
          description: Suggested price per duration, ordered by months. The amount charged may still be any other.
          items: { $ref: "#/components/schemas/MembershipPrice" }
    NewMembershipPlan:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, "null"], maxLength: 200 }
        is_active: { type: boolean, default: true }
        position: { type: integer, minimum: 0, maximum: 1000, description: Defaults to last. }
        prices:
          type: array
          description: One price per duration, 1 to 24 months, amount like "100.00".
          items: { $ref: "#/components/schemas/MembershipPrice" }
    MembershipPlanChanges:
      type: object
      description: Send only the fields to change.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, "null"], maxLength: 200 }
        is_active: { type: boolean }
        position: { type: integer, minimum: 0, maximum: 1000 }
        prices:
          type: array
          description: Replaces the whole price list.
          items: { $ref: "#/components/schemas/MembershipPrice" }
    BranchName:
      type: object
      required: [id, name, gym_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gym_name: { type: string }
    MemberCounts:
      type: object
      required: [all, active, expiring, expired, scheduled]
      properties:
        all: { type: integer }
        active: { type: integer }
        expiring: { type: integer }
        expired: { type: integer }
        scheduled: { type: integer }
    MemberView:
      type: object
      required: [id, document_type, document_number, full_name, phone, home_branch, status, days_remaining, plan_label, plan_names, starts_on, ends_on, last_receipt]
      properties:
        id: { type: string, format: uuid }
        document_type: { type: string, enum: [dni, ce] }
        document_number: { type: string }
        full_name: { type: string }
        phone: { type: string }
        home_branch: { $ref: "#/components/schemas/BranchName" }
        status: { type: string, enum: [active, expiring, expired, scheduled] }
        days_remaining: { type: integer, description: "Covered member: days until the coverage end (see business-rules, section 4: the latest end among the current periods of any plan, extended by periods that continue it). Otherwise days until the latest end of any period; negative when expired." }
        plan_label: { type: string, example: 3 meses }
        plan_names: { type: array, items: { type: string }, description: "The plans the member holds today; for a member with none current, the last one they held." }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        last_receipt: { type: [string, "null"], example: R-000012 }
    AccessBranch:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: Atlas Fitness · Miraflores }
    ReceiptRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: R-000012 }
    MembershipView:
      type: object
      required: [id, plan_id, plan_name, months, plan_label, starts_on, ends_on, amount, access_scope, access_branches, receipt]
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string, description: The plan's name when the period was sold (a photo; never changes). }
        months: { type: integer, minimum: 1, maximum: 24 }
        plan_label: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        amount: { type: string, example: "270.00" }
        access_scope: { type: string, enum: [branch, gym] }
        access_branches: { type: array, items: { $ref: "#/components/schemas/AccessBranch" } }
        receipt: { oneOf: [{ $ref: "#/components/schemas/ReceiptRef" }, { type: "null" }] }
        amended_at: { type: [string, "null"], format: date-time, description: When the period was last corrected (PATCH); null if never. }
    MemberDetail:
      allOf:
        - { $ref: "#/components/schemas/MemberView" }
        - type: object
          required: [memberships]
          properties:
            memberships: { type: array, items: { $ref: "#/components/schemas/MembershipView" } }
    Sale:
      type: object
      required: [member, membership, receipt]
      properties:
        member: { $ref: "#/components/schemas/MemberView" }
        membership: { $ref: "#/components/schemas/MembershipView" }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
    AmendMembership:
      type: object
      description: At least one field. The end date is recalculated by the server.
      properties:
        months: { type: integer, minimum: 1, maximum: 24 }
        starts_on: { type: string, format: date }
        amount: { type: string, example: "270.00" }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
    MembershipAmendment:
      type: object
      required: [id, changed_at, changed_by, before, after]
      properties:
        id: { type: string, format: uuid }
        changed_at: { type: string, format: date-time }
        changed_by:
          type: object
          required: [id, full_name]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
        before: { $ref: "#/components/schemas/PeriodState" }
        after: { $ref: "#/components/schemas/PeriodState" }
    PeriodState:
      type: object
      properties:
        months: { type: integer }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        amount: { type: string, example: "270.00" }
        method: { type: string }
    Product:
      type: object
      required: [id, name, price, is_active, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        price: { type: string, example: "8.50" }
        is_active: { type: boolean }
        position: { type: integer }
    NewProduct:
      type: object
      required: [name, price]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        name: { type: string, maxLength: 60 }
        price: { type: string, example: "8.50", description: 0.01 to 10000.00. }
        is_active: { type: boolean, default: true }
        position: { type: integer, minimum: 0, description: Omit to put it last. }
    ProductChanges:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        price: { type: string }
        is_active: { type: boolean }
        position: { type: integer, minimum: 0 }
    NewProductSale:
      type: object
      required: [branch_id, items]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        branch_id: { type: string, format: uuid }
        member_id: { type: [string, "null"], format: uuid, description: Optional when paid; required for a pending sale. }
        status: { type: string, enum: [paid, pending], default: paid }
        method: { type: string, enum: [yape_plin, cash, card, transfer], description: Required when paid; ignored for a pending sale. }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
    ProductSale:
      type: object
      required: [id, branch, status, was_pending, method, total, units, sold_at, sold_on, sold_by, member, collection_id, collected_at, items]
      properties:
        id: { type: string, format: uuid }
        branch:
          type: object
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        status: { type: string, enum: [paid, pending], description: "`pending` is an open pending sale." }
        was_pending: { type: boolean, description: The sale was born as a pending sale (even when collected now). }
        method: { type: [string, "null"], description: Null for an open pending sale. }
        total: { type: string, example: "26.50" }
        units: { type: integer }
        sold_at: { type: string, format: date-time }
        sold_on: { type: string, format: date, description: Lima date. }
        sold_by:
          type: object
          required: [id, full_name]
          properties: { id: { type: string, format: uuid }, full_name: { type: string } }
        member:
          oneOf:
            - $ref: "#/components/schemas/SaleMember"
            - { type: "null" }
        collection_id: { type: [string, "null"], format: uuid }
        collected_at: { type: [string, "null"], format: date-time }
        items:
          type: array
          items:
            type: object
            required: [product_id, name, quantity, unit_price, line_total]
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string, description: The product's name at the time of the sale. }
              quantity: { type: integer }
              unit_price: { type: string, example: "8.00" }
              line_total: { type: string, example: "24.00" }
    SaleMember:
      type: object
      required: [id, full_name, document_number]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        document_number: { type: string }
    PendingBalance:
      type: object
      required: [member, balance, pending_count, oldest_sold_on]
      properties:
        member: { $ref: "#/components/schemas/SaleMember" }
        balance: { type: string, example: "21.00" }
        pending_count: { type: integer }
        oldest_sold_on: { type: string, format: date }
    MemberPending:
      type: object
      required: [member_id, balance, pending_count, sales]
      properties:
        member_id: { type: string, format: uuid }
        balance: { type: string, example: "21.00" }
        pending_count: { type: integer }
        sales: { type: array, items: { $ref: "#/components/schemas/ProductSale" } }
    NewCollection:
      type: object
      required: [member_id, branch_id, method]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        member_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid, description: The branch that collects. }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        sale_ids: { type: array, items: { type: string, format: uuid }, description: Whole pending sales to collect; absent or empty = all of the member's. }
    Collection:
      type: object
      required: [id, member, branch, method, amount, collected_at, collected_by, sale_ids, remaining_balance]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: "#/components/schemas/SaleMember" }
        branch:
          type: object
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        method: { type: string }
        amount: { type: string, example: "13.00" }
        collected_at: { type: string, format: date-time }
        collected_by:
          type: object
          required: [id, full_name]
          properties: { id: { type: string, format: uuid }, full_name: { type: string } }
        sale_ids: { type: array, items: { type: string, format: uuid } }
        remaining_balance: { type: string, example: "0.00", description: What the member still owes after this collection. }
    ProductsReport:
      type: object
      required: [from, to, group_by, branch_id, totals, by_product, by_period]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        group_by: { type: string, enum: [day, month] }
        branch_id: { type: [string, "null"], format: uuid }
        totals:
          type: object
          required: [sales_count, units, total_sold, collected_total, pending_total]
          properties:
            sales_count: { type: integer }
            units: { type: integer }
            total_sold: { type: string, example: "63.00" }
            collected_total: { type: string, example: "47.00" }
            pending_total: { type: string, example: "16.00" }
        by_product:
          type: array
          description: Most units first.
          items:
            type: object
            required: [product_id, name, units, total]
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              units: { type: integer }
              total: { type: string }
        by_period:
          type: array
          description: Oldest first. `period` is `YYYY-MM-DD` or `YYYY-MM`.
          items:
            type: object
            required: [period, sales_count, units, total]
            properties:
              period: { type: string, example: "2026-10-30" }
              sales_count: { type: integer }
              units: { type: integer }
              total: { type: string }
    EnrollMember:
      type: object
      required: [branch_id, document_type, document_number, full_name, phone, months, amount, method]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        branch_id: { type: string, format: uuid, description: Where it is enrolled and collected; becomes the home branch. }
        document_type: { type: string, enum: [dni, ce] }
        document_number: { type: string, description: DNI 8 digits; CE 9 to 12. }
        full_name: { type: string, minLength: 3, maxLength: 120 }
        phone: { type: string, pattern: "^9[0-9]{8}$" }
        plan_id: { type: string, format: uuid, description: "Required when the gym has more than one active plan; optional otherwise (the only active plan is used)." }
        months: { type: integer, minimum: 1, maximum: 24 }
        starts_on: { type: string, format: date, description: Defaults to today (Lima). }
        amount: { type: string, example: "270.00", description: Total charged, 0 to 1,000,000.00. }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        access_scope: { type: string, enum: [branch, gym], default: branch }
        access_branch_ids:
          type: array
          description: Defaults to every branch of the scope; must contain the home branch and be a subset of the scope.
          items: { type: string, format: uuid }
    RenewMember:
      type: object
      required: [branch_id, months, amount, method]
      properties:
        id: { type: string, format: uuid, description: Optional id of the new period; makes the request idempotent. }
        branch_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid, description: "Required when the gym has more than one active plan; optional otherwise." }
        months: { type: integer, minimum: 1, maximum: 24 }
        starts_on: { type: string, format: date }
        amount: { type: string }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        access_scope: { type: string, enum: [branch, gym], default: branch }
        access_branch_ids: { type: array, items: { type: string, format: uuid } }
    ReceiptSummary:
      type: object
      required: [id, number, issued_on, plan_label, amount, method]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        issued_on: { type: string, format: date }
        plan_label: { type: string }
        plan_name: { type: [string, "null"], description: The membership plan sold; null for a day pass. }
        amount: { type: string }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
    ReceiptDetail:
      type: object
      required: [id, number, kind, issued_on, gym, branch, member, membership, payment]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: R-000012 }
        kind: { type: string, enum: [membership, day_pass] }
        issued_on: { type: string, format: date }
        gym:
          type: object
          required: [name, tax_id, brand_color, logo_url]
          properties:
            name: { type: string, description: The display name when the gym has one. }
            tax_id: { type: [string, "null"] }
            brand_color: { type: string }
            logo_url: { type: [string, "null"], description: Temporary signed https link to the gym's logo (same as `Gym.logo_url`); null when none or unavailable. }
        branch:
          type: object
          required: [name, address]
          properties:
            name: { type: string }
            address: { type: [string, "null"] }
        member:
          oneOf:
            - type: object
              required: [full_name, document_type, document_number, phone]
              properties:
                full_name: { type: string }
                document_type: { type: string }
                document_number: { type: string }
                phone: { type: string }
            - { type: "null" }
        membership:
          oneOf:
            - type: object
              required: [plan_name, months, plan_label, starts_on, ends_on, access_branches]
              properties:
                plan_name: { type: string, description: The plan's name when it was sold. }
                months: { type: integer }
                plan_label: { type: string }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                access_branches: { type: array, items: { $ref: "#/components/schemas/AccessBranch" } }
            - { type: "null" }
        payment:
          type: object
          required: [amount, method]
          properties:
            amount: { type: string }
            method: { type: string }
    AccessCheck:
      type: object
      required: [event_id, allowed, reason, expiring_in_days, ends_on, member, checked_at]
      properties:
        event_id: { type: string, format: uuid }
        allowed: { type: boolean }
        reason: { type: string, enum: [MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED, MEMBERSHIP_NOT_STARTED, BRANCH_NOT_ALLOWED, NOT_REGISTERED] }
        expiring_in_days: { type: [integer, "null"] }
        ends_on: { type: [string, "null"], format: date }
        member:
          oneOf:
            - type: object
              required: [id, full_name, document_number]
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
                document_number: { type: string }
            - { type: "null" }
        checked_at: { type: string, format: date-time, description: Server time. }
    AccessEvent:
      type: object
      required: [id, checked_at, branch, kind, allowed, reason, display_name, document_number, member_id]
      properties:
        id: { type: string, format: uuid }
        checked_at: { type: string, format: date-time }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        kind: { type: string, enum: [check, day_pass] }
        allowed: { type: boolean }
        reason: { type: string, enum: [MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED, MEMBERSHIP_NOT_STARTED, BRANCH_NOT_ALLOWED, NOT_REGISTERED, DAY_PASS] }
        display_name: { type: string }
        document_number: { type: [string, "null"] }
        member_id: { type: [string, "null"], format: uuid }
    DayPass:
      type: object
      required: [id, receipt, branch, amount, method, visitor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        amount: { type: string, example: "15.00" }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        visitor_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    PaymentRow:
      type: object
      required: [id, paid_on, receipt, kind, plan_label, amount, method, member, visitor_name, branch, voucher_count]
      properties:
        id: { type: string, format: uuid }
        voucher_count: { type: integer, minimum: 0, maximum: 5, description: How many proofs of payment are attached. }
        paid_on: { type: string, format: date }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
        kind: { type: string, enum: [membership, day_pass] }
        plan_label: { type: string, example: 3 meses }
        plan_name: { type: [string, "null"], description: The membership plan sold; null for a day pass. }
        amount: { type: string, example: "270.00" }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        member:
          oneOf:
            - type: object
              required: [id, full_name]
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
            - { type: "null" }
        visitor_name: { type: [string, "null"] }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    PaymentTotals:
      type: object
      required: [amount, count, day_passes, average, top_method, by_method]
      properties:
        amount: { type: string, example: "355.50" }
        count: { type: integer }
        day_passes: { type: integer }
        average: { type: [string, "null"], description: Null when there are no payments. }
        top_method: { type: [string, "null"] }
        by_method:
          type: object
          required: [yape_plin, cash, card, transfer]
          description: The four methods, always present ("0.00" when unused).
          properties:
            yape_plin: { type: string }
            cash: { type: string }
            card: { type: string }
            transfer: { type: string }
    Dashboard:
      type: object
      required: [date, members, income, access, expiring_soon]
      properties:
        date: { type: string, format: date }
        members:
          type: object
          required: [active, expiring, expired, scheduled]
          description: The web shows "Vigentes" as active + expiring.
          properties:
            active: { type: integer }
            expiring: { type: integer }
            expired: { type: integer }
            scheduled: { type: integer }
        income:
          type: object
          required: [today, month]
          properties:
            today: { type: string }
            month: { type: string }
        access:
          type: object
          required: [allowed_today, denied_today]
          properties:
            allowed_today: { type: integer }
            denied_today: { type: integer }
        expiring_soon:
          type: array
          items:
            type: object
            required: [member_id, full_name, ends_on, days_remaining, phone]
            properties:
              member_id: { type: string, format: uuid }
              full_name: { type: string }
              ends_on: { type: string, format: date }
              days_remaining: { type: integer }
              phone: { type: string }
    User:
      type: object
      required: [id, document_number, full_name, phone, role, gym, branches]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string, example: "10000002" }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [admin, receptionist] }
        gym:
          description: The company of the token, the gym the person is working in.
          type: object
          required: [id, name, brand_color, logo_url, features]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            features: { $ref: "#/components/schemas/Features" }
            brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
            logo_url: { type: [string, "null"], description: Temporary signed https link to the gym's logo (same as `Gym.logo_url`); null when none or unavailable. }
        branches:
          type: array
          description: All the branches of the gym for an admin, the assigned ones for a receptionist.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              gym_id: { type: string, format: uuid }
              gym_name: { type: string }
    AdminBranch:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"] }
    AdminGym:
      type: object
      required: [id, group_id, auth_tenant_id, auth_client_id, ruc, name, brand_color, features, branches]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        auth_tenant_id: { type: string, format: uuid }
        auth_client_id: { type: string, format: uuid }
        ruc: { type: [string, "null"], description: Null when the company has none. }
        name: { type: string }
        brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        features: { $ref: "#/components/schemas/Features" }
        branches:
          type: array
          items: { $ref: "#/components/schemas/AdminBranch" }
    AdminGroup:
      type: object
      description: An internal label that bundles related gyms. Not a user.
      required: [id, name, gyms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gyms:
          type: array
          items: { $ref: "#/components/schemas/AdminGym" }
    Named:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Person:
      type: object
      properties:
        document_number: { type: string }
        first_names: { type: string }
        paternal_surname: { type: string }
        maternal_surname: { type: string }
        full_name: { type: string }
    Company:
      type: object
      properties:
        document_number: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        address: { type: [string, "null"] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    KioskSettings:
      type: object
      required: [pin_set]
      properties:
        pin_set: { type: boolean }

    BodyMeasurementInput:
      type: object
      description: At least one value is required. Decimals have at most one digit and may be numbers or strings.
      properties:
        id: { type: string, format: uuid, description: Client id; makes a retry idempotent (POST only). }
        measured_on: { type: string, format: date, description: Lima date, default today, not in the future. }
        weight_kg: { type: number, minimum: 20, maximum: 400 }
        height_cm: { type: number, minimum: 50, maximum: 250 }
        body_fat_pct: { type: number, minimum: 2, maximum: 70 }
        waist_cm: { type: number, minimum: 20, maximum: 300 }
        chest_cm: { type: number, minimum: 20, maximum: 300 }
        hip_cm: { type: number, minimum: 20, maximum: 300 }
        notes: { type: string, maxLength: 500 }
    BodyMeasurement:
      type: object
      required: [id, member_id, measured_on, notes, created_by, created_by_name, created_at, updated_by, updated_by_name, updated_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        measured_on: { type: string, format: date }
        weight_kg: { type: number, nullable: true }
        height_cm: { type: number, nullable: true }
        body_fat_pct: { type: number, nullable: true }
        waist_cm: { type: number, nullable: true }
        chest_cm: { type: number, nullable: true }
        hip_cm: { type: number, nullable: true }
        notes: { type: string }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
        updated_by_name: { type: string }
        updated_at: { type: string, format: date-time }
    BodyRoutineInput:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid, description: Client id; makes a retry idempotent (POST only). }
        started_on: { type: string, format: date, description: Lima date, default today, not in the future. }
        title: { type: string, minLength: 1, maxLength: 80 }
        content: { type: string, maxLength: 5000, description: Free text. }
        notes: { type: string, maxLength: 500 }
        is_current: { type: boolean, default: true }
    BodyRoutine:
      type: object
      required: [id, member_id, started_on, title, content, notes, is_current, created_by, created_by_name, created_at, updated_by, updated_by_name, updated_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        started_on: { type: string, format: date }
        title: { type: string }
        content: { type: string }
        notes: { type: string }
        is_current: { type: boolean }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
        updated_by_name: { type: string }
        updated_at: { type: string, format: date-time }
    BodyAccessEntry:
      type: object
      required: [id, user_id, user_name, action, resource, resource_id, occurred_at]
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid }
        user_name: { type: string }
        action: { type: string, enum: [read, create, update, delete] }
        resource: { type: string, enum: [measurements, routines] }
        resource_id: { type: string, format: uuid, nullable: true, description: Null for a read of the whole list. }
        occurred_at: { type: string, format: date-time }
  responses:
    ApiError:
      description: Error. The code says what happened (see the endpoint description).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: "`VALIDATION_FAILED`. `details` is `[{ field, code }]`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`FORBIDDEN`, `NO_ACCESS` (the token does not open Pulso) or `USER_INACTIVE` (blocked in Pulso)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`UNAUTHORIZED`: missing, invalid or expired token. Ask atm-auth-api for a new one (refresh) and retry once."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DocumentNotFound:
      description: "`DOCUMENT_NOT_FOUND`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LookupUnavailable:
      description: "`LOOKUP_UNAVAILABLE`: the lookup service failed; the web falls back to manual entry."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
