openapi: 3.1.0
info:
  title: Pulso API
  version: 0.1.0
  description: |
    Backend of Pulso, Atmósfera's gym administration product.

    - Everything lives under `/api/v1`. JSON, `snake_case`.
    - Success: `{ "data": ... }`. Error: `{ "error": { "code", "message", "details" } }`.
    - `code` is stable and in English; `message` is Spanish and only a readable fallback.
    - Authentication is a stateless **access token** in `Authorization: Bearer <token>`.
      There is no refresh token and no session: the web keeps the token in memory only.
servers:
  - url: http://localhost:3001/api/v1
    description: local development
tags:
  - name: health
  - name: auth
  - name: profile
  - name: documents

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness. The process answers.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness. The database answers too.
      responses:
        "200": { description: ok }
        "503": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with DNI and password.
      description: |
        Nothing is stored: no session row and no refresh token. An unknown DNI, a wrong
        password and an inactive user all answer `INVALID_CREDENTIALS`, so the caller cannot
        tell which one it was. After 5 failures in 15 minutes a DNI answers
        `TOO_MANY_ATTEMPTS` with `Retry-After`. There is also a stricter per-IP limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_number, password]
              properties:
                document_number: { type: string, pattern: "^[0-9]{8}$", example: "10000002" }
                password: { type: string, example: "Pulso2026!" }
      responses:
        "200":
          description: signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /me:
    get:
      tags: [profile]
      summary: The signed-in user and where they work.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
    patch:
      tags: [profile]
      summary: Edit your own non-sensitive data (name and phone).
      description: The DNI, role and scope cannot be edited here.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, minLength: 3, maxLength: 120 }
                phone:
                  type: string
                  pattern: "^9[0-9]{8}$"
                  description: Optional. An empty string clears it.
      responses:
        "200":
          description: the updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }

  /clients:
    get:
      tags: [accounts]
      summary: List clients with gyms and plan state.
      description: Superadmin only; organization inspection headers are ignored.
      security: [{ bearer: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN or PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [accounts]
      summary: Create a client atomically with a DNI temporary password.
      description: Superadmin only; organization inspection headers are ignored.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClient" }
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN or PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: PLAN_LIMIT_EXCEEDED (extra_gyms and extra_branches in details), USER_DOCUMENT_TAKEN, or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /clients/summary:
    get:
      tags: [accounts]
      summary: Count clients and their resources.
      description: Superadmin only; organization inspection headers are ignored.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ClientSummary" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN or PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /clients/{client_id}/gyms:
    post:
      tags: [accounts]
      summary: Add an agreed gym to a client.
      description: Superadmin only; organization inspection headers are ignored.
      security: [{ bearer: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGym" }
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Gym" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN or PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: PLAN_LIMIT_EXCEEDED (extra_gyms and extra_branches in details), USER_DOCUMENT_TAKEN, or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /gyms/{gym_id}/branches:
    post:
      tags: [accounts]
      summary: Add an agreed branch to a gym.
      description: Superadmin only; organization inspection headers are ignored.
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBranch" }
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogBranch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN or PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: PLAN_LIMIT_EXCEEDED (extra_gyms and extra_branches in details), USER_DOCUMENT_TAKEN, or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /catalog:
    get:
      tags: [accounts]
      summary: Read the shared organization directory and accessible branches.
      description: Other roles ignore the inspection header and use their live organization.
      security: [{ bearer: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          description: Required for superadmin inspection only.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization directory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404":
          description: Organization does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      tags: [accounts]
      summary: List the users the caller manages.
      description: Owner sees the organization; admin sees itself and the receptionists of its gym. Reception gets 403; the superadmin may inspect with X-Organization-Id.
      security: [{ bearer: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          description: Superadmin inspection on GET only; ignored for other roles.
          schema: { type: string, format: uuid }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TeamUser" }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [accounts]
      summary: Create an admin or receptionist.
      description: The temporary password is the DNI and must be changed at first login. Only an owner creates admins; an admin creates receptionists of its own gym.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewUser" }
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: USER_DOCUMENT_TAKEN or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}:
    patch:
      tags: [accounts]
      summary: Change a user's name, DNI, role, gym or branches.
      description: A DNI correction and a scope change invalidate the user's tokens. Nobody edits themselves or an owner.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserChanges" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: USER_DOCUMENT_TAKEN or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/activate:
    post:
      tags: [accounts]
      summary: Reactivate a user.
      description: Immediate effect.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/deactivate:
    post:
      tags: [accounts]
      summary: Deactivate a user.
      description: Takes effect on the next request; history is kept.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /users/{id}/password:
    post:
      tags: [accounts]
      summary: Reset a user's password to their DNI.
      description: Sets must_change_password and invalidates existing tokens.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /gyms/{gym_id}:
    patch:
      tags: [accounts]
      summary: Change a gym's identity, day pass price or branch sharing.
      description: Owner of the organization or admin of that gym. Send only the fields to change; null for display_name or day_pass_price restores the default.
      security: [{ bearer: [] }]
      parameters:
        - { name: gym_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GymChanges" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Gym" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /clients/{client_id}/owner:
    patch:
      tags: [accounts]
      summary: Correct a client owner's name or DNI.
      description: Superadmin only. Role, gym and branches cannot be changed here. Invalidates the owner's tokens.
      security: [{ bearer: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserChanges" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: USER_DOCUMENT_TAKEN or CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /clients/{client_id}/owner/password:
    post:
      tags: [accounts]
      summary: Reset a client owner's password to their DNI.
      description: Superadmin only.
      security: [{ bearer: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TeamUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN, PASSWORD_CHANGE_REQUIRED, ROLE_NOT_ASSIGNABLE, SCOPE_NOT_ALLOWED, CANNOT_MODIFY_SELF or CANNOT_MODIFY_OWNER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: NOT_FOUND (also for resources of another organization).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /members:
    get:
      tags: [members]
      summary: List the shared member directory with status counts.
      description: Every role of the organization sees every member. The superadmin may inspect with X-Organization-Id. Counts ignore the status filter but respect q and home_branch_id.
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name or document (contains). }
        - { name: status, in: query, schema: { type: string, enum: [active, expiring, expired, scheduled] } }
        - { name: home_branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MemberView" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Pagination" }
                      - type: object
                        properties:
                          counts: { $ref: "#/components/schemas/MemberCounts" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [members]
      summary: Enroll a member (member, first period, payment and receipt in one transaction).
      description: |
        The branch must be one the caller works in. Repeating the same `id` returns the original sale with 200.
        Errors: MEMBER_DOCUMENT_TAKEN (409, details.member_id), BRANCH_NOT_ACCESSIBLE (403), SCOPE_NOT_ALLOWED (400, foreign branch),
        ACCESS_BRANCHES_INVALID (400), VALIDATION_FAILED (400). The superadmin gets 403.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollMember" }
      responses:
        "200": { description: Repeated request; the original sale., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /members/{id}:
    get:
      tags: [members]
      summary: A member with every period.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The member., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberDetail" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      tags: [members]
      summary: Edit name and phone (the document never changes).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 3, maxLength: 120 }
                phone: { type: string, pattern: "^9[0-9]{8}$" }
      responses:
        "200": { description: The updated member., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/MemberDetail" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/renewals:
    post:
      tags: [members]
      summary: Renew a member (new period, payment and receipt).
      description: |
        `starts_on` defaults to the latest end date when it is in the future, otherwise today (the server decides).
        `branch_id` is where it is collected and may differ from the home branch, which never changes.
        Repeating the same `id` (the period id) returns the original sale with 200.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewMember" }
      responses:
        "200": { description: Repeated request; the original sale., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Sale" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /members/{id}/receipts:
    get:
      tags: [members]
      summary: Receipts of a member, newest first.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The receipts., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ReceiptSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }
  /receipts/{id}:
    get:
      tags: [members]
      summary: Printable data of a receipt (membership or day pass).
      description: Any past receipt can be reprinted. A receipt of another organization answers 404.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The receipt., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReceiptDetail" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }

  /access/checks:
    post:
      tags: [access]
      summary: Check a member in at a branch (decided on the server, always logged).
      description: |
        Send `member_id` or `document_number`. A denied check is still `200` with `allowed: false` and a `reason`:
        MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED (ends_on = last end), MEMBERSHIP_NOT_STARTED (ends_on = start date),
        BRANCH_NOT_ALLOWED, NOT_REGISTERED. An allowed answer ending within 7 days has `expiring_in_days`.
        Unknown `member_id` is 404 MEMBER_NOT_FOUND. Repeating the same `id` returns the original answer without a second entry.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                member_id: { type: string, format: uuid }
                document_number: { type: string }
      responses:
        "200": { description: The decision., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AccessCheck" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /access/events:
    get:
      tags: [access]
      summary: History of access entries (checks and day passes), newest first.
      description: Owner sees the organization, admin its gym, reception its assigned branches. A `branch_id` the caller cannot reach is 403 BRANCH_NOT_ACCESSIBLE.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string, enum: [allowed, denied] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Lima date, inclusive. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Lima date, inclusive. }
        - { name: q, in: query, schema: { type: string }, description: Name or document (contains). }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AccessEvent" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /access/summary:
    get:
      tags: [access]
      summary: Allowed and denied checks and day passes of one Lima day.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today (Lima). }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [allowed, denied, day_passes]
                    properties:
                      allowed: { type: integer }
                      denied: { type: integer }
                      day_passes: { type: integer }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /day-passes:
    get:
      tags: [access]
      summary: List day passes of the branches the caller reaches.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of day passes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DayPass" } }
                  meta: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [access]
      summary: Sell a day pass (pass, receipt D-NNNNNN, payment and an allowed entry in one transaction).
      description: |
        The price is the gym's (15.00 when it has none); the client cannot choose it. An `amount` is accepted only when it equals the price
        (otherwise VALIDATION_FAILED, AMOUNT_NOT_ALLOWED). Every `visitor` field is optional. Repeating the same `id` returns the original with 200.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, method]
              properties:
                id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                method: { type: string, enum: [yape_plin, cash, card, transfer] }
                amount: { type: string, description: Optional; must equal the gym price. }
                visitor:
                  type: object
                  properties:
                    document_type: { type: string, enum: [dni, ce] }
                    document_number: { type: string }
                    full_name: { type: string }
                    phone: { type: string, pattern: "^9[0-9]{8}$" }
      responses:
        "200": { description: Repeated request; the original., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /day-passes/{id}:
    get:
      tags: [access]
      summary: One day pass. Print it with GET /receipts/{receipt.id}.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The day pass., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/DayPass" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ApiError" }

  /payments:
    get:
      tags: [reports]
      summary: Payments of the branches the caller reaches, with the totals of the whole filter.
      description: |
        Owner reaches the organization, admin its gym, reception its assigned branches. Dates are Lima dates, inclusive; the default range is the current month and the widest is 366 days.
        `meta.totals` covers the whole filter (not just the page) and is **omitted for reception**, who must not get KPIs.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string, enum: [yape_plin, cash, card, transfer] } }
        - { name: kind, in: query, schema: { type: string, enum: [membership, day_pass] } }
        - { name: q, in: query, schema: { type: string }, description: Member name or document, or visitor name (contains). }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of payments, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaymentRow" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Pagination" }
                      - type: object
                        properties:
                          totals: { $ref: "#/components/schemas/PaymentTotals" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
  /payments/export:
    get:
      tags: [reports]
      summary: Download the filtered payments as CSV.
      description: |
        Owner and admin only (reception gets 403). Same filters as `/payments`, no pagination. UTF-8 with BOM, comma separated; columns
        Boleta, Miembro, Documento, Plan, Importe, Medio de pago, Fecha. More than 10,000 rows is 413 EXPORT_TOO_LARGE. Cells that start with `= + - @` are prefixed with `'`.
        Fetch it with the Bearer header and save the blob; never put the token in a URL.
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string, enum: [yape_plin, cash, card, transfer] } }
        - { name: kind, in: query, schema: { type: string, enum: [membership, day_pass] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }
        "413": { $ref: "#/components/responses/ApiError" }
  /dashboard:
    get:
      tags: [reports]
      summary: Figures of a gym or branch for today and this month.
      description: Owner and admin only (reception gets 403). A new organization answers zeros, never sample data. `expiring_soon` has at most five members, nearest end date first.
      security: [{ bearer: [] }]
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: gym_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The dashboard., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Dashboard" } } } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ApiError" }

  /me/password:
    post:
      tags: [profile]
      summary: Change your own password.
      description: |
        Every older token stops working at once and a fresh one is returned, so the user
        stays signed in on this device for a voluntary change. When `must_change_password`
        is true, completion returns `login_required: true` without a token; sign in again.
        Restricted tokens only allow GET /me and POST /me/password; other authenticated
        endpoints return 403 PASSWORD_CHANGE_REQUIRED. A wrong current password answers
        `CURRENT_PASSWORD_INCORRECT` with **400** (not 401, so the web does not read it as an
        ended session) and repeated failures are limited.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Session"
                      - type: object
                        required: [login_required]
                        properties:
                          login_required: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /documents/persons/{document_number}:
    get:
      tags: [documents]
      summary: Names of a DNI, resolved by atm-identity-api.
      description: Any signed-in user. Carné de extranjería is not resolved; enter it manually.
      security: [{ bearer: [] }]
      parameters:
        - { name: document_number, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
      responses:
        "200":
          description: the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "502": { $ref: "#/components/responses/LookupUnavailable" }

  /documents/companies/{document_number}:
    get:
      tags: [documents]
      summary: Legal name and address of a RUC, resolved by atm-identity-api.
      security: [{ bearer: [] }]
      parameters:
        - { name: document_number, in: path, required: true, schema: { type: string, pattern: "^[0-9]{11}$" } }
      responses:
        "200":
          description: the company
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PasswordChangeRequired" }
        "404": { $ref: "#/components/responses/DocumentNotFound" }
        "502": { $ref: "#/components/responses/LookupUnavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    ClientSummary:
      type: object
      required: [clients, gyms, branches, client_users]
      properties:
        clients: { type: integer }
        gyms: { type: integer }
        branches: { type: integer }
        client_users: { type: integer }
    Client:
      type: object
      required: [id, name, owner, gyms, plan]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner:
          type: object
          required: [id, document_number, full_name, is_active]
          properties:
            id: { type: string, format: uuid }
            document_number: { type: string }
            full_name: { type: string }
            is_active: { type: boolean }
        gyms:
          type: array
          items: { $ref: "#/components/schemas/Gym" }
        plan:
          type: object
          required: [state, extra_gyms, extra_branches]
          properties:
            state: { type: string, enum: [free, extras] }
            extra_gyms: { type: integer }
            extra_branches: { type: integer }
    NewClient:
      type: object
      required: [owner, gyms]
      properties:
        id: { type: string, format: uuid }
        agreed_extra: { type: boolean, default: false }
        owner:
          type: object
          required: [document_number, first_names, last_names, email, phone]
          properties:
            document_number: { type: string, pattern: '^[0-9]{8}$' }
            first_names: { type: string }
            last_names: { type: string }
            email: { type: string, format: email }
            phone: { type: string, pattern: '^9[0-9]{8}$' }
        gyms:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NewGym" }
    NewGym:
      type: object
      required: [name, branches]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        tax_id: { type: string, pattern: '^[0-9]{11}$' }
        agreed_extra: { type: boolean, default: false }
        branches:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NewBranch" }
    NewBranch:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string }
        agreed_extra: { type: boolean, default: false }
    CatalogBranch:
      type: object
      required: [id, name, address, accessible]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"] }
        accessible: { type: boolean }
    Catalog:
      type: object
      required: [organization, gyms]
      properties:
        organization: { $ref: "#/components/schemas/Named" }
        gyms:
          type: array
          items: { $ref: "#/components/schemas/Gym" }
    Gym:
      type: object
      required: [id, name, display_name, tax_id, brand_color, day_pass_price, day_pass_price_is_default, branch_sharing, branches]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: [string, "null"] }
        tax_id: { type: [string, "null"] }
        brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        day_pass_price: { type: string, example: "15.00" }
        day_pass_price_is_default: { type: boolean }
        branch_sharing: { type: boolean }
        branches:
          type: array
          items:
            type: object
            required: [id, name, address, accessible]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              address: { type: [string, "null"] }
              accessible: { type: boolean }
    TeamUser:
      type: object
      required: [id, full_name, document_number, phone, role, is_active, is_self, gym, branches]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        document_number: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [owner, admin, receptionist] }
        is_active: { type: boolean }
        is_self: { type: boolean }
        gym:
          description: The gym an admin manages. Null for the other roles.
          oneOf: [{ $ref: "#/components/schemas/Named" }, { type: "null" }]
        branches:
          type: array
          items:
            type: object
            required: [id, name, gym_id]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              gym_id: { type: string, format: uuid }
    NewUser:
      type: object
      required: [full_name, document_number, role]
      properties:
        id: { type: string, format: uuid, description: Optional; repeating a request with the same id is idempotent. }
        full_name: { type: string, minLength: 3, maxLength: 120 }
        document_number: { type: string, pattern: "^[0-9]{8}$" }
        role: { type: string, enum: [admin, receptionist] }
        gym_id: { type: string, format: uuid, description: Required for admin. }
        branch_ids:
          type: array
          description: Required for receptionist (one or more).
          items: { type: string, format: uuid }
    UserChanges:
      type: object
      description: Send only the fields to change.
      properties:
        full_name: { type: string, minLength: 3, maxLength: 120 }
        document_number: { type: string, pattern: "^[0-9]{8}$" }
        role: { type: string, enum: [admin, receptionist] }
        gym_id: { type: string, format: uuid }
        branch_ids:
          type: array
          items: { type: string, format: uuid }
    GymChanges:
      type: object
      description: Send only the fields to change.
      properties:
        display_name: { type: [string, "null"], minLength: 1, maxLength: 80 }
        brand_color: { type: string, pattern: '^#[0-9a-f]{6}$' }
        day_pass_price: { type: [string, "null"], example: "15.00" }
        branch_sharing: { type: boolean }
    BranchName:
      type: object
      required: [id, name, gym_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gym_name: { type: string }
    MemberCounts:
      type: object
      required: [all, active, expiring, expired, scheduled]
      properties:
        all: { type: integer }
        active: { type: integer }
        expiring: { type: integer }
        expired: { type: integer }
        scheduled: { type: integer }
    MemberView:
      type: object
      required: [id, document_type, document_number, full_name, phone, home_branch, status, days_remaining, plan_label, starts_on, ends_on, last_receipt]
      properties:
        id: { type: string, format: uuid }
        document_type: { type: string, enum: [dni, ce] }
        document_number: { type: string }
        full_name: { type: string }
        phone: { type: string }
        home_branch: { $ref: "#/components/schemas/BranchName" }
        status: { type: string, enum: [active, expiring, expired, scheduled] }
        days_remaining: { type: integer, description: Days until the latest end date; negative when expired. }
        plan_label: { type: string, example: 3 meses }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        last_receipt: { type: [string, "null"], example: R-000012 }
    AccessBranch:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: Atlas Fitness · Miraflores }
    ReceiptRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: R-000012 }
    MembershipView:
      type: object
      required: [id, months, plan_label, starts_on, ends_on, amount, access_scope, access_branches, receipt]
      properties:
        id: { type: string, format: uuid }
        months: { type: integer, minimum: 1, maximum: 24 }
        plan_label: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        amount: { type: string, example: "270.00" }
        access_scope: { type: string, enum: [branch, gym, network] }
        access_branches: { type: array, items: { $ref: "#/components/schemas/AccessBranch" } }
        receipt: { oneOf: [{ $ref: "#/components/schemas/ReceiptRef" }, { type: "null" }] }
    MemberDetail:
      allOf:
        - { $ref: "#/components/schemas/MemberView" }
        - type: object
          required: [memberships]
          properties:
            memberships: { type: array, items: { $ref: "#/components/schemas/MembershipView" } }
    Sale:
      type: object
      required: [member, membership, receipt]
      properties:
        member: { $ref: "#/components/schemas/MemberView" }
        membership: { $ref: "#/components/schemas/MembershipView" }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
    EnrollMember:
      type: object
      required: [branch_id, document_type, document_number, full_name, phone, months, amount, method]
      properties:
        id: { type: string, format: uuid, description: Optional; makes the request idempotent. }
        branch_id: { type: string, format: uuid, description: Where it is enrolled and collected; becomes the home branch. }
        document_type: { type: string, enum: [dni, ce] }
        document_number: { type: string, description: DNI 8 digits; CE 9 to 12. }
        full_name: { type: string, minLength: 3, maxLength: 120 }
        phone: { type: string, pattern: "^9[0-9]{8}$" }
        months: { type: integer, minimum: 1, maximum: 24 }
        starts_on: { type: string, format: date, description: Defaults to today (Lima). }
        amount: { type: string, example: "270.00", description: Total charged, 0 to 1,000,000.00. }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        access_scope: { type: string, enum: [branch, gym, network], default: branch }
        access_branch_ids:
          type: array
          description: Defaults to every branch of the scope; must contain the home branch and be a subset of the scope.
          items: { type: string, format: uuid }
    RenewMember:
      type: object
      required: [branch_id, months, amount, method]
      properties:
        id: { type: string, format: uuid, description: Optional id of the new period; makes the request idempotent. }
        branch_id: { type: string, format: uuid }
        months: { type: integer, minimum: 1, maximum: 24 }
        starts_on: { type: string, format: date }
        amount: { type: string }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        access_scope: { type: string, enum: [branch, gym, network], default: branch }
        access_branch_ids: { type: array, items: { type: string, format: uuid } }
    ReceiptSummary:
      type: object
      required: [id, number, issued_on, plan_label, amount, method]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        issued_on: { type: string, format: date }
        plan_label: { type: string }
        amount: { type: string }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
    ReceiptDetail:
      type: object
      required: [id, number, kind, issued_on, gym, branch, member, membership, payment]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: R-000012 }
        kind: { type: string, enum: [membership, day_pass] }
        issued_on: { type: string, format: date }
        gym:
          type: object
          required: [name, tax_id, brand_color]
          properties:
            name: { type: string, description: The display name when the gym has one. }
            tax_id: { type: [string, "null"] }
            brand_color: { type: string }
        branch:
          type: object
          required: [name, address]
          properties:
            name: { type: string }
            address: { type: [string, "null"] }
        member:
          oneOf:
            - type: object
              required: [full_name, document_type, document_number, phone]
              properties:
                full_name: { type: string }
                document_type: { type: string }
                document_number: { type: string }
                phone: { type: string }
            - { type: "null" }
        membership:
          oneOf:
            - type: object
              required: [months, plan_label, starts_on, ends_on, access_branches]
              properties:
                months: { type: integer }
                plan_label: { type: string }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                access_branches: { type: array, items: { $ref: "#/components/schemas/AccessBranch" } }
            - { type: "null" }
        payment:
          type: object
          required: [amount, method]
          properties:
            amount: { type: string }
            method: { type: string }
    AccessCheck:
      type: object
      required: [event_id, allowed, reason, expiring_in_days, ends_on, member, checked_at]
      properties:
        event_id: { type: string, format: uuid }
        allowed: { type: boolean }
        reason: { type: string, enum: [MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED, MEMBERSHIP_NOT_STARTED, BRANCH_NOT_ALLOWED, NOT_REGISTERED] }
        expiring_in_days: { type: [integer, "null"] }
        ends_on: { type: [string, "null"], format: date }
        member:
          oneOf:
            - type: object
              required: [id, full_name, document_number]
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
                document_number: { type: string }
            - { type: "null" }
        checked_at: { type: string, format: date-time, description: Server time. }
    AccessEvent:
      type: object
      required: [id, checked_at, branch, kind, allowed, reason, display_name, document_number, member_id]
      properties:
        id: { type: string, format: uuid }
        checked_at: { type: string, format: date-time }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        kind: { type: string, enum: [check, day_pass] }
        allowed: { type: boolean }
        reason: { type: string, enum: [MEMBERSHIP_VALID, MEMBERSHIP_EXPIRED, MEMBERSHIP_NOT_STARTED, BRANCH_NOT_ALLOWED, NOT_REGISTERED, DAY_PASS] }
        display_name: { type: string }
        document_number: { type: [string, "null"] }
        member_id: { type: [string, "null"], format: uuid }
    DayPass:
      type: object
      required: [id, receipt, branch, amount, method, visitor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        amount: { type: string, example: "15.00" }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        visitor_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    PaymentRow:
      type: object
      required: [id, paid_on, receipt, kind, plan_label, amount, method, member, visitor_name, branch]
      properties:
        id: { type: string, format: uuid }
        paid_on: { type: string, format: date }
        receipt: { $ref: "#/components/schemas/ReceiptRef" }
        kind: { type: string, enum: [membership, day_pass] }
        plan_label: { type: string, example: 3 meses }
        amount: { type: string, example: "270.00" }
        method: { type: string, enum: [yape_plin, cash, card, transfer] }
        member:
          oneOf:
            - type: object
              required: [id, full_name]
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
            - { type: "null" }
        visitor_name: { type: [string, "null"] }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    PaymentTotals:
      type: object
      required: [amount, count, day_passes, average, top_method, by_method]
      properties:
        amount: { type: string, example: "355.50" }
        count: { type: integer }
        day_passes: { type: integer }
        average: { type: [string, "null"], description: Null when there are no payments. }
        top_method: { type: [string, "null"] }
        by_method:
          type: object
          required: [yape_plin, cash, card, transfer]
          description: The four methods, always present ("0.00" when unused).
          properties:
            yape_plin: { type: string }
            cash: { type: string }
            card: { type: string }
            transfer: { type: string }
    Dashboard:
      type: object
      required: [date, members, income, access, expiring_soon]
      properties:
        date: { type: string, format: date }
        members:
          type: object
          required: [active, expiring, expired, scheduled]
          description: The web shows "Vigentes" as active + expiring.
          properties:
            active: { type: integer }
            expiring: { type: integer }
            expired: { type: integer }
            scheduled: { type: integer }
        income:
          type: object
          required: [today, month]
          properties:
            today: { type: string }
            month: { type: string }
        access:
          type: object
          required: [allowed_today, denied_today]
          properties:
            allowed_today: { type: integer }
            denied_today: { type: integer }
        expiring_soon:
          type: array
          items:
            type: object
            required: [member_id, full_name, ends_on, days_remaining, phone]
            properties:
              member_id: { type: string, format: uuid }
              full_name: { type: string }
              ends_on: { type: string, format: date }
              days_remaining: { type: integer }
              phone: { type: string }
    Session:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        expires_in: { type: integer, description: Seconds until it stops working, example: 28800 }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [must_change_password]
      properties:
        must_change_password: { type: boolean }
        id: { type: string, format: uuid }
        document_type: { type: string, enum: [dni] }
        document_number: { type: string, example: "10000002" }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [superadmin, owner, admin, receptionist] }
        organization:
          description: The client. Null for the superadmin.
          oneOf: [{ $ref: "#/components/schemas/Named" }, { type: "null" }]
        gym:
          description: The gym an admin manages. Null for the other roles.
          oneOf: [{ $ref: "#/components/schemas/Named" }, { type: "null" }]
        branches:
          type: array
          description: Only a receptionist has assigned branches.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              gym_id: { type: string, format: uuid }
              gym_name: { type: string }
    Named:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Person:
      type: object
      properties:
        document_number: { type: string }
        first_names: { type: string }
        paternal_surname: { type: string }
        maternal_surname: { type: string }
        full_name: { type: string }
    Company:
      type: object
      properties:
        document_number: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        address: { type: [string, "null"] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
  responses:
    ApiError:
      description: Error. The code says what happened (see the endpoint description).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: "`VALIDATION_FAILED`. `details` is `[{ field, code }]`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordChangeRequired:
      description: "`PASSWORD_CHANGE_REQUIRED`: set a new password before accessing the application."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`UNAUTHORIZED`: missing, invalid or expired token, inactive user, or a token from before a password change."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: "`INVALID_CREDENTIALS`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: "`TOO_MANY_ATTEMPTS`. `Retry-After` says how many seconds to wait."
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DocumentNotFound:
      description: "`DOCUMENT_NOT_FOUND`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LookupUnavailable:
      description: "`LOOKUP_UNAVAILABLE`: the lookup service failed; the web falls back to manual entry."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
